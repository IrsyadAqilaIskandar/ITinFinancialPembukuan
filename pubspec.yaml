name: umkm_pembukuan
description: Aplikasi pembukuan sederhana untuk usaha UMKM (pemasukan, pengeluaran, laporan)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  intl: ^0.19.0
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.6
  pdf: ^3.11.1
  share_plus: ^11.0.0
  csv: ^6.0.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
